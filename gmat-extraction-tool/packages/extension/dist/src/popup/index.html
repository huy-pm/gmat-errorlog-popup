<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GMAT Logger</title>
  <style>
    body {
      width: 300px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    h1 { font-size: 18px; margin-top: 0; }
    button {
      background-color: #2563eb;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
      width: 100%;
      font-weight: 500;
    }
    button:hover { background-color: #1d4ed8; }
    button:disabled { background-color: #9ca3af; cursor: not-allowed; }
    .hidden { display: none; }
    #status { margin-top: 12px; font-size: 14px; text-align: center; color: #6b7280; }
  </style>
  <script type="module" crossorigin src="/src/popup/index.js"></script>
</head>
<body>
  <div id="app">
    <h1>GMAT Logger</h1>
    <div id="login-view" class="hidden">
      <p>Please sign in to log questions.</p>
      <button id="btn-login">Sign In with Google</button>
    </div>
    <div id="main-view" class="hidden">
      <p>Logged in as: <span id="user-email"></span></p>
      <button id="btn-open-sidebar">Open Sidebar</button>
      <button id="btn-logout" style="background-color: #ef4444; margin-top: 8px;">Sign Out</button>
    </div>
    <div id="status">Checking status...</div>
  </div>
</body>
</html>
