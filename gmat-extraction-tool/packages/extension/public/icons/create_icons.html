<!DOCTYPE html>
<html>
<head>
    <title>Generate GMAT Icons</title>
</head>
<body>
    <canvas id="canvas16" width="16" height="16"></canvas>
    <canvas id="canvas48" width="48" height="48"></canvas>
    <canvas id="canvas128" width="128" height="128"></canvas>
    <div id="links"></div>

    <script>
        function createIcon(canvasId, size) {
            const canvas = document.getElementById(canvasId);
            const ctx = canvas.getContext('2d');
            
            // Black background
            ctx.fillStyle = '#1a1a1a';
            ctx.fillRect(0, 0, size, size);
            
            // White text
            ctx.fillStyle = '#ffffff';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            
            // Font size based on canvas size
            let fontSize = size * 0.35;
            ctx.font = `bold ${fontSize}px Arial, sans-serif`;
            
            // Draw "GMAT" text
            ctx.fillText('GMAT', size / 2, size / 2);
            
            // Create download link
            const link = document.createElement('a');
            link.download = `icon${size}.png`;
            link.href = canvas.toDataURL('image/png');
            link.textContent = `Download icon${size}.png`;
            link.style.display = 'block';
            link.style.margin = '10px';
            document.getElementById('links').appendChild(link);
        }
        
        createIcon('canvas16', 16);
        createIcon('canvas48', 48);
        createIcon('canvas128', 128);
        
        // Auto-click all download links
        setTimeout(() => {
            document.querySelectorAll('a').forEach(a => a.click());
        }, 500);
    </script>
</body>
</html>
