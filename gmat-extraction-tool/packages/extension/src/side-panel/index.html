<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GMAT Batch Scraper</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 13px;
      color: #333;
      background: #f8f9fa;
    }

    /* Header */
    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      padding: 16px;
      color: white;
    }
    .header h1 { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
    .header .subtitle { font-size: 11px; opacity: 0.8; }
    .status-badge {
      display: inline-block;
      padding: 2px 8px;
      background: rgba(255,255,255,0.2);
      border-radius: 10px;
      font-size: 11px;
      float: right;
      margin-top: 2px;
    }
    .status-badge.running { background: rgba(72,187,120,0.4); }
    .status-badge.complete { background: rgba(72,187,120,0.6); }

    /* Sections */
    .section { padding: 12px 16px; border-bottom: 1px solid #eee; background: white; }
    .section-title { font-weight: 600; font-size: 12px; color: #555; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }

    /* Discovery */
    .discover-btn {
      width: 100%;
      padding: 10px;
      background: #f0f4ff;
      border: 1px dashed #667eea;
      border-radius: 8px;
      color: #667eea;
      font-weight: 600;
      cursor: pointer;
      font-size: 13px;
    }
    .discover-btn:hover { background: #e8edff; }
    .discover-btn:disabled { opacity: 0.6; cursor: not-allowed; }

    /* Category List */
    .cat-controls { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .cat-controls button {
      padding: 2px 8px;
      background: none;
      border: 1px solid #ddd;
      border-radius: 4px;
      cursor: pointer;
      font-size: 11px;
      color: #666;
    }
    .cat-controls button:hover { background: #f0f0f0; }
    .category-list {
      max-height: 300px;
      overflow-y: auto;
      border: 1px solid #eee;
      border-radius: 8px;
      padding: 4px;
    }
    .category-list:empty::after {
      content: "No categories discovered yet. Navigate to a GMAT Hero study page and click Discover.";
      display: block;
      text-align: center;
      color: #999;
      padding: 20px 12px;
      font-size: 12px;
    }
    .cat-section-label {
      padding: 4px 8px;
      font-weight: 600;
      font-size: 11px;
      color: #667eea;
      text-transform: uppercase;
      margin-top: 4px;
    }
    .cat-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 5px 8px;
      cursor: pointer;
      border-radius: 4px;
    }
    .cat-item:hover { background: #f7f7ff; }
    .cat-item input { width: 14px; height: 14px; cursor: pointer; }
    .cat-item .name { flex: 1; font-size: 12px; }
    .cat-item .count { font-size: 11px; color: #999; }

    /* Options */
    .options { display: flex; flex-direction: column; gap: 10px; }
    .option-row { display: flex; align-items: center; gap: 8px; }
    .option-row label { font-size: 13px; color: #555; cursor: pointer; display: flex; align-items: center; gap: 8px; }
    .option-row input[type="checkbox"] { width: 16px; height: 16px; cursor: pointer; }
    .concurrency-select {
      padding: 4px 8px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 13px;
      background: white;
    }

    /* Controls */
    .controls { padding: 12px 16px; border-top: 1px solid #eee; display: flex; gap: 8px; background: white; position: sticky; bottom: 0; }
    .btn-start {
      flex: 1;
      padding: 10px;
      background: linear-gradient(135deg, #48bb78, #38a169);
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      font-size: 13px;
    }
    .btn-start:hover { filter: brightness(1.05); }
    .btn-start:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-stop {
      flex: 1;
      padding: 10px;
      background: linear-gradient(135deg, #f56565, #e53e3e);
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      font-size: 13px;
      display: none;
    }

    /* Progress */
    .progress-section { display: none; }
    .progress-section.active { display: block; }
    .progress-bar-track {
      background: #eee;
      border-radius: 4px;
      height: 6px;
      overflow: hidden;
      margin: 8px 0;
    }
    .progress-bar-fill {
      background: linear-gradient(90deg, #667eea, #764ba2);
      height: 100%;
      width: 0%;
      transition: width 0.5s ease;
      border-radius: 4px;
    }
    .progress-stats { font-size: 12px; color: #666; margin-bottom: 8px; }

    /* Worker tabs */
    .workers-title { font-size: 12px; font-weight: 600; color: #555; margin: 8px 0 4px; }
    .worker-list { display: flex; flex-direction: column; gap: 4px; }
    .worker-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 8px;
      background: #f8f9fa;
      border-radius: 6px;
      font-size: 12px;
    }
    .worker-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #9ca3af;
      flex-shrink: 0;
    }
    .worker-dot.active { background: #48bb78; animation: pulse-dot 1.5s ease infinite; }
    .worker-dot.idle { background: #d1d5db; }
    .worker-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .worker-status { color: #888; font-size: 11px; white-space: nowrap; }

    @keyframes pulse-dot {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    /* Results */
    .results-section { display: none; }
    .results-section.active { display: block; }
    .results-box {
      padding: 12px;
      border-radius: 8px;
      font-size: 12px;
    }
    .results-success { background: #f0fff4; border: 1px solid #c6f6d5; color: #2d6a4f; }
    .results-errors { background: #fff5f5; border: 1px solid #fed7d7; color: #c53030; margin-top: 8px; }
    .results-box .title { font-weight: 600; margin-bottom: 6px; }

    /* Settings tip */
    .settings-tip {
      padding: 8px 12px;
      background: #fffbeb;
      border: 1px solid #fcd34d;
      border-radius: 6px;
      font-size: 11px;
      color: #92400e;
      line-height: 1.4;
    }
    .settings-tip a {
      color: #b45309;
      text-decoration: underline;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="header">
    <span id="status-badge" class="status-badge">Idle</span>
    <h1>⚡ Batch Scraper</h1>
    <div class="subtitle">GMAT Hero Parallel Extraction · <span id="version-label"></span></div>
  </div>

  <!-- Discovery -->
  <div class="section">
    <button id="btn-discover" class="discover-btn">🔍 Discover Categories from Active Tab</button>
  </div>

  <!-- Category List -->
  <div class="section">
    <div class="cat-controls">
      <span class="section-title" style="margin: 0;">Categories</span>
      <div>
        <button id="btn-select-all">Select All</button>
        <button id="btn-deselect-all">None</button>
      </div>
    </div>
    <div id="category-list" class="category-list"></div>
  </div>

  <!-- Options -->
  <div class="section">
    <div class="options">
      <div class="option-row">
        <label>
          <input type="checkbox" id="chk-incorrect-only">
          Extract incorrect questions only
        </label>
      </div>
      <div class="option-row">
        <label for="sel-concurrency">Parallel tabs:</label>
        <select id="sel-concurrency" class="concurrency-select">
          <option value="1">1 tab</option>
          <option value="2">2 tabs</option>
          <option value="3" selected>3 tabs</option>
          <option value="4">4 tabs</option>
          <option value="5">5 tabs</option>
        </select>
      </div>
    </div>
    <div class="settings-tip" style="margin-top: 10px;">
      💡 For <b>silent auto-save</b> (no Save dialog), disable Chrome's
      "<i>Ask where to save each file</i>" in
      <a id="link-chrome-settings">chrome://settings/downloads</a>.
      Files will save to <code>~/Downloads/GMAT-HERO/</code>.
    </div>
  </div>

  <!-- Progress -->
  <div id="progress-section" class="section progress-section">
    <div class="section-title">Progress</div>
    <div class="progress-stats">
      <span id="progress-label">Starting...</span>
      <span id="progress-count" style="float: right;">0/0</span>
    </div>
    <div class="progress-bar-track">
      <div id="progress-bar" class="progress-bar-fill"></div>
    </div>
    <div id="progress-details" style="font-size: 11px; color: #888;"></div>

    <div class="workers-title">Worker Tabs</div>
    <div id="worker-list" class="worker-list"></div>
  </div>

  <!-- Results -->
  <div id="results-section" class="section results-section">
    <div id="results-success" class="results-box results-success">
      <div class="title">✅ Batch Complete</div>
      <div id="results-summary"></div>
    </div>
    <div id="results-errors" class="results-box results-errors" style="display: none;">
      <div class="title">⚠️ Issues Found</div>
      <div id="error-summary"></div>
    </div>
  </div>

  <!-- Controls -->
  <div class="controls">
    <button id="btn-start" class="btn-start">▶ Start Batch</button>
    <button id="btn-stop" class="btn-stop">⏹ Stop</button>
  </div>

  <script type="module" src="./index.ts"></script>
</body>
</html>
